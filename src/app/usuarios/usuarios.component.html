<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold text-slate-900">Usuarios</h1>
    <button class="sf-btn-ghost" (click)="cargar()">Refrescar</button>
  </div>

  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
    <div *ngFor="let u of usuarios" class="sf-card p-5">
      <div class="flex items-start justify-between gap-3">
        <div>
          <div class="text-xs font-medium text-slate-500">Usuario</div>
          <div class="text-lg font-semibold text-slate-900">{{ u.usuario }}</div>
        </div>
        <span class="sf-pill">{{ u.rol }}</span>
      </div>

      <div class="mt-4 space-y-2 text-sm text-slate-700">
        <div class="flex items-center justify-between gap-3">
          <span class="text-slate-500">Correo</span>
          <span class="font-medium text-slate-900">{{ u.email }}</span>
        </div>
        <div class="flex items-center justify-between gap-3">
          <span class="text-slate-500">Dirección</span>
          <span class="font-medium text-slate-900">{{ u.direccion }}</span>
        </div>
        <div class="flex items-center justify-between gap-3">
          <span class="text-slate-500">Teléfono</span>
          <span class="font-medium text-slate-900">{{ u.telefono }}</span>
        </div>
      </div>

      <div class="mt-5 flex items-center gap-2">
        <button class="sf-btn-primary px-3 py-2 text-xs" (click)="abrirEditar(u)">
          Editar
        </button>
        <button class="sf-btn-danger px-3 py-2 text-xs" (click)="eliminar(u.id)">
          Eliminar
        </button>
      </div>
    </div>
  </div>

  <div
    *ngIf="selected"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
    (click)="cerrarEditar()"
  >
    <div class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-xl" (click)="$event.stopPropagation()">
      <div class="flex items-start justify-between gap-4">
        <div>
          <div class="text-xs font-medium text-slate-500">Editar usuario</div>
          <div class="text-lg font-semibold text-slate-900">{{ selected.usuario }}</div>
        </div>
        <button class="sf-btn-ghost px-3 py-1" (click)="cerrarEditar()">
          Cerrar
        </button>
      </div>

      <div class="mt-5 space-y-4">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Correo</label>
          <input class="sf-input" [(ngModel)]="editModel.email" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Dirección</label>
          <input class="sf-input" [(ngModel)]="editModel.direccion" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Teléfono</label>
          <input class="sf-input" [(ngModel)]="editModel.telefono" />
        </div>
      </div>

      <div class="mt-6 flex items-center justify-end gap-2">
        <button class="sf-btn-ghost px-4 py-2" (click)="cerrarEditar()">
          Cancelar
        </button>
        <button
          class="sf-btn-primary px-4 py-2"
          [disabled]="saving"
          (click)="guardar()"
        >
          Guardar cambios
        </button>
      </div>
    </div>
  </div>
</div>
