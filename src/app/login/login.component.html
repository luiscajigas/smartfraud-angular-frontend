<div class="sf-app-bg relative flex min-h-[calc(100vh-72px)] items-center justify-center overflow-hidden px-4 py-8">
  <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_1px_1px,rgba(16,185,129,0.08)_1px,transparent_0)] bg-[length:24px_24px]"></div>

  <!-- Split card -->
  <div class="relative z-10 flex w-full max-w-4xl overflow-hidden rounded-[28px] border border-emerald-100 bg-white shadow-2xl">

    <!-- Left panel -->
    <div
      class="hidden w-2/5 flex-col items-center justify-center bg-gradient-to-br from-emerald-600 via-emerald-800 to-slate-950 px-10 py-16 text-white md:flex"
    >
      <div class="relative mb-7">
        <div class="absolute -inset-6 rounded-3xl bg-white/10 blur-xl"></div>
        <div class="relative flex h-16 w-16 items-center justify-center rounded-2xl bg-white/10 ring-1 ring-white/20">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3l7 4v6c0 5-3 8-7 8s-7-3-7-8V7l7-4z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.5 12.5l1.8 1.8 3.8-4.3" />
          </svg>
      </div>
      </div>
      <h1 class="text-2xl font-bold mb-2 text-center">SmartFraud</h1>
      <p class="text-emerald-100 text-sm text-center leading-relaxed">
        Un motor de riesgo con reglas inteligentes y trazabilidad para revisar transacciones sospechosas.
      </p>
      <div class="mt-8 grid w-full grid-cols-2 gap-3 text-xs text-emerald-50/90">
        <div class="rounded-2xl bg-white/10 p-3 ring-1 ring-white/10">
          <div class="font-semibold">JWT</div>
          <div class="mt-1 text-emerald-50/70">Access + Refresh</div>
        </div>
        <div class="rounded-2xl bg-white/10 p-3 ring-1 ring-white/10">
          <div class="font-semibold">Alertas</div>
          <div class="mt-1 text-emerald-50/70">Prioridad</div>
        </div>
      </div>
    </div>

    <!-- Right panel -->
    <div class="flex w-full flex-col justify-center bg-white px-10 py-14 md:w-3/5">

      <h2 class="text-2xl font-bold text-gray-900 mb-1">Bienvenido de nuevo</h2>
      <p class="text-sm text-gray-500 mb-8">Ingrese sus credenciales para acceder al sistema.</p>

      <!-- Mensaje de error -->
      <div *ngIf="errorMessage" class="mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 flex items-start gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4v2m0-12a9 9 0 110 18 9 9 0 010-18zm0-2a11 11 0 11-10 6.5" />
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>

        <!-- Usuario -->
        <div class="mb-5">
          <label class="block text-xs font-semibold text-gray-500 tracking-widest uppercase mb-1.5" for="usuario">
            Usuario
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </span>
            <input
              id="usuario"
              name="usuario"
              type="text"
              [(ngModel)]="credentials.usuario"
              required
              placeholder="admin"
              class="sf-input pl-9 pr-4 py-2.5"
            />
          </div>
        </div>

        <!-- Contraseña -->
        <div class="mb-5">
          <label class="block text-xs font-semibold text-gray-500 tracking-widest uppercase mb-1.5" for="contrasena">
            Contraseña
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input
              id="contrasena"
              name="contrasena"
              type="password"
              [(ngModel)]="credentials.contrasena"
              required
              placeholder="••••••••"
              class="sf-input pl-9 pr-4 py-2.5"
            />
          </div>
        </div>

        <!-- Recordarme / Olvidó contraseña -->
        <div class="flex items-center justify-between mb-7">
          <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer select-none">
            <input
              type="checkbox"
              name="recordarme"
              [(ngModel)]="credentials.recordarme"
              class="h-4 w-4 rounded border-gray-300 text-gray-900 focus:ring-gray-800"
            />
            Recordarme
          </label>
          <a routerLink="/register" class="text-sm text-gray-700 hover:underline">Crear cuenta</a>
        </div>

        <!-- Botón -->
        <button type="submit" [disabled]="loginForm.invalid" class="w-full sf-btn-primary py-2.5 text-sm">
          Iniciar sesión
        </button>

      </form>

      <!-- Footer -->
      <div class="mt-8 pt-6 border-t border-emerald-100 text-center">
        <p class="text-sm text-gray-500">
          Admin:
          <span class="text-gray-800 font-medium">admin / 12345</span>
        </p>
      </div>

    </div>
  </div>
</div>
